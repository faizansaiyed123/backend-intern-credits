name: Mintline backend demo CI

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

permissions:
  contents: read

jobs:
  test:
    name: Test isolated demo API
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install demo and test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Run API contract tests
        run: python -m unittest discover -s backend-intern-credits/tests -v
